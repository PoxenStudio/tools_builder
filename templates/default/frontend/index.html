<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>{{NAME}}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 24px; color: #222; }
    body[data-theme="dark"] { background: #121212; color: #eee; }
    button { padding: 8px 16px; cursor: pointer; }
    pre { background: rgba(128, 128, 128, 0.15); padding: 12px; border-radius: 6px; overflow: auto; }
  </style>
</head>
<body>
  <h1>{{NAME}}</h1>
  <p id="status" data-i18n="status.loading">loading...</p>
  <button id="run-btn" data-i18n="action.run">Run</button>
  <pre id="result"></pre>

  <!--
    MyBooksToolBridge 由宿主 MyBooks 在运行时提供（app/public/static/toolbox-bridge.js，
    随 mybooks/mybooks 核心仓库构建发布），本地用 `mybooks-tool dev` 预览时（未来能力）会
    注入一份本地 mock 实现，接口形状一致。见 document/Toolbox_Dynamic_Design.md 4.3 节。

    lib/i18n.js 是脚手架给的默认 i18n 胶水代码，读取 locales/*.json 并跟 bridge.locale /
    bridge.onLocaleChange 联动（见 document/Toolbox_Dynamic_Design.md 4.6 节）。不是强制
    约定——想换成别的 i18n 方案，删掉这个文件、按自己的技术栈接 bridge 即可。
  -->
  <script src="/static/toolbox-bridge.js"></script>
  <script src="lib/i18n.js"></script>
  <script>
    var bridge = window.MyBooksToolBridge;
    var i18n = window.MyBooksToolI18n.create();

    function applyTheme(theme) {
      document.body.setAttribute('data-theme', theme);
    }
    applyTheme(bridge.theme);
    // 宿主切换深浅色主题时会通过 postMessage 实时推送，不需要重新加载 iframe（4.5 节）
    bridge.onThemeChange(applyTheme);

    i18n.ready.then(function () {
      document.getElementById('status').textContent = i18n.t('status.ready', { theme: bridge.theme });
    });
    // 宿主切换语言时，i18n 会自动重新加载对应字串表并调用 applyDom() 刷新页面上所有
    // data-i18n 元素；这里只需要额外刷新用 i18n.t() 手写的那部分文本。
    i18n.onChange(function () {
      document.getElementById('status').textContent = i18n.t('status.ready', { theme: bridge.theme });
    });

    document.getElementById('run-btn').addEventListener('click', function () {
      bridge.fetch('run').then(function (data) {
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        bridge.notify(i18n.t('result.success'), 'success');
      }).catch(function (err) {
        bridge.notify(i18n.t('result.error', { error: err }), 'error');
      });
    });
  </script>
</body>
</html>
